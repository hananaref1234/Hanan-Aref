# Experimental webcam config for li-stick-navigation-v0.2-exp1 (stairs + curb).
# Production live loop still uses config/config.yaml + yolo26n.pt (COCO).
#
#   python main.py --config config/config_v02_exp1.yaml --classes config/classes_v02_exp1.yaml
#
# Point the camera at a staircase or curb image/video. This is not a safety
# evaluation and does not classify up/down.

camera:
  backend: "opencv"
  device: 0
  width: 1280
  height: 720
  fps: 30

detector:
  model_path: "models/li_stick_navigation_v0.2_exp1.pt"
  confidence_threshold: 0.40
  image_size: 640
  use_class_filter: true

visualization:
  enabled: true
  show_fps: true
  show_latency: true
  show_direction_zones: true

tracking:
  enabled: true
  tracker: "bytetrack"
  confirmation_frames: 3
  max_missing_frames: 5
  confidence_smoothing_alpha: 0.4
  direction_history_size: 5

events:
  suppress_duplicates: true
  duplicate_cooldown_seconds: 3.0
  emit_direction_changes: true
  log_lost_tracks: true

logging:
  level: "INFO"
