# Experimental stairs/curb training run: li-stick-navigation-v0.2-exp1
# Does not replace config/training.yaml (canonical 12-class dataset path).
# Derived dataset: data/training/li_stick_v02_exp1/ (training IDs 0=stairs, 1=curb).

model:
  base_model: "yolo26n.pt"

training:
  epochs: 80
  image_size: 640
  batch_size: 16
  patience: 20
  device: "auto"
  # Windows DataLoader: 4 workers is enough for this GPU box.
  workers: 4

dataset:
  yaml: "data/training/li_stick_v02_exp1/dataset.yaml"

output:
  project: "runs/li_stick"
  name: "v02_exp1"
  register: "models/li_stick_navigation_v0.2_exp1.pt"

# Conservative geometry-preserving augmentations for stairs/curb.
# Horizontal flip is allowed: left/right does not change the semantic class.
# Vertical flip remains forbidden.
# Mosaic/erasing are lower than the default training.yaml so thin curbs
# are less likely to be wiped or mixed into unrealistic composites.
augmentation:
  hsv_h: 0.015
  hsv_s: 0.40
  hsv_v: 0.40
  degrees: 5.0
  translate: 0.08
  scale: 0.20
  shear: 0.0
  perspective: 0.0004
  fliplr: 0.50
  flipud: 0.0
  mosaic: 0.20
  mixup: 0.0
  erasing: 0.08
