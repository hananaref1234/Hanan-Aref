# Raspberry Pi 5 + Camera Module V2 NoIR deployment config.
# Uses the v0.3-combined checkpoint (13-class: 6 custom hazards + 7 generics).
#
# Live run command:
#   python main.py \
#     --config config/config_rpi5_combined.yaml \
#     --classes config/classes_v03_combined.yaml
#
# Or the wrapper:
#   python scripts/run_rpi5_live.py

camera:
  backend: "picamera2"
  device: 0          # unused by Picamera2; kept for config schema compatibility
  width: 1280
  height: 720
  fps: 30

detector:
  model_path: "models/li_stick_navigation_v0.3_combined.pt"
  confidence_threshold: 0.40
  image_size: 640
  use_class_filter: true

visualization:
  enabled: false           # headless by default on Pi (SSH deployment)
  show_fps: false
  show_latency: false
  show_direction_zones: false

tracking:
  enabled: true
  tracker: "bytetrack"
  confirmation_frames: 3
  max_missing_frames: 5
  confidence_smoothing_alpha: 0.4
  direction_history_size: 5

events:
  suppress_duplicates: true
  duplicate_cooldown_seconds: 3.0
  emit_direction_changes: true
  log_lost_tracks: true

logging:
  level: "INFO"
