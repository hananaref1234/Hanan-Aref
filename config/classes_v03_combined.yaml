# Class filter for the v0.3-combined 13-class checkpoint.
# ObjectDetector remaps training IDs to global Li-Stick IDs via
# models/li_stick_navigation_v0.3_combined.class_map.yaml.
allowed_classes:
  - pole
  - bollard
  - stairs
  - curb
  - barrier
  - tree_trunk
  - person
  - bicycle
  - car
  - motorcycle
  - bus
  - truck
  - chair
