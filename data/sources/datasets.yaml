      Non-commercial academic/personal use; citation required; redistribution of
      images/labels forbidden. Li-Stick may become a product, so legal review is
      required before training on this data. wall and pole are semantic classes
      without instance IDs; boxes would be derived from connected components and
      lose concave shape, merged adjacent instances, and pixel-precise extent.
      Never map vegetation to tree_trunk. Register at cityscapes-dataset.com.
      Place leftImg8bit and gtFine under data/raw/cityscapes/.
    raw_dir: data/raw/cityscapes
    disk_space_hint: "~11 GB leftImg8bit train/val/test plus ~0.25–1 GB gtFine"

