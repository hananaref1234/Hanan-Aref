# Li-Stick dataset source manifest.
# Never mark a source APPROVED unless both license and mapping are verified.
# Status values: APPROVED | MANUAL_DOWNLOAD_REQUIRED | MANUAL_REVIEW_REQUIRED
#                LICENSE_REVIEW_REQUIRED | REJECTED
#
# date_accessed: 2026-08-18
# No source in this file is APPROVED. SideGuide raw files are still absent.

sources:
  - name: sideguide
    official_url: https://ytaek-oh.github.io/sideguide
    license: sideguide_terms_noncommercial_research_no_redistribution
    license_url: https://docs.google.com/forms/d/e/1FAIpQLScBmoVoj0d-omBOVCHGjhRislXP0TYzRqaUJOmJcqN6ylQcxQ/viewform
    date_accessed: "2026-08-18"
    download_method: request_form
    annotation_format: >
      Published bbox/polygon labels are CSV (image id/name/width/height, label,
      occluded, xtl/ytl, xbr/ybr, z_order; polygon points for the mask subset).
      On-disk archive names are unknown until the authors send the download link.
      The current importer parses JSON (COCO or simple boxes); CSV support must
      be added after the official files are placed on disk, not before.
    source_classes:
      - pole
      - bollard
      - tree trunk
      - barricade
      - chair
      - table
      - person
      - bicycle
      - motorcycle
      - car
      - wheelchair
      - stroller
    listick_mapping:
      pole: {target: pole, mapping_type: DIRECT, auto: true}
      bollard: {target: bollard, mapping_type: DIRECT, auto: true}
      tree trunk: {target: tree_trunk, mapping_type: DIRECT, auto: true}
      barricade: {target: barrier, mapping_type: SEMANTIC_REVIEW, auto: false}
      person: {target: person, mapping_type: DIRECT, auto: false, taxonomy: combined}
      bicycle: {target: bicycle, mapping_type: DIRECT, auto: false, taxonomy: combined}
      motorcycle: {target: motorcycle, mapping_type: DIRECT, auto: false, taxonomy: combined}
      car: {target: car, mapping_type: DIRECT, auto: false, taxonomy: combined}
      chair: {target: chair, mapping_type: DIRECT, auto: false, taxonomy: combined}
      table: {target: null, mapping_type: CUSTOM, auto: false}
      wheelchair: {target: null, mapping_type: CUSTOM, auto: false}
      stroller: {target: null, mapping_type: CUSTOM, auto: false}
    status: MANUAL_DOWNLOAD_REQUIRED
    notes: >
      NOT APPROVED FOR LI-STICK USE (2026-08-18). SideGuide remains unavailable and
      must not be imported unless access and licensing are later explicitly approved.
      Inspected 2026-08-18: data/raw/sideguide/ contains only README.md. No images,
      no CSV/JSON annotations, no archives. Exp2 training is blocked until a
      legitimate official release is placed here. Do not scrape, fabricate, or
      substitute another dataset. Published scale (IROS 2020 / Testworks datasheet):
      bbox set train 249K / val 37K / test 67K images (~350K total, ~3.38M boxes);
      polygon and stereo subsets are not required for Exp2. Candidate Exp2 source
      classes: pole, bollard, tree trunk, barricade (barricade stays SEMANTIC_REVIEW).
      Official form terms (2026-08-18): non-commercial research only; academic
      email required; no copy/distribute/sell of the dataset or derived data;
      Korean law; cite Park et al. IROS 2020. This source is still not APPROVED.
      Contact after the form: datahub@aiworkx.ai. Korean AI-Hub listing may be
      restricted to domestic users; do not bypass that portal either.
    request_url: https://docs.google.com/forms/d/e/1FAIpQLScBmoVoj0d-omBOVCHGjhRislXP0TYzRqaUJOmJcqN6ylQcxQ/viewform
    raw_dir: data/raw/sideguide
    disk_space_hint: bbox set ~350K 1920x1080 images plus CSV labels (tens of GB; stereo/polygon extra)

