    listick_mapping:
      stairs: {target: stairs, mapping_type: DIRECT, auto: true}
      stair: {target: stairs, mapping_type: DIRECT, auto: true}
      step: {target: null, mapping_type: CUSTOM, auto: false}
      curb: {target: curb, mapping_type: DIRECT, auto: true}
      kerb: {target: curb, mapping_type: DIRECT, auto: true}
      ramp: {target: null, mapping_type: CUSTOM, auto: false}
      grab bar: {target: null, mapping_type: CUSTOM, auto: false}
      grab_bar: {target: null, mapping_type: CUSTOM, auto: false}
    status: MANUAL_REVIEW_REQUIRED
    notes: >
      Downloaded 2026-08-17 from the official Zenodo record (not a mirror).
      File wm_barriers_data.zip = 7972407510 bytes; MD5 d96051ca1339d1c1afa9ac736eabd058 verified.
      Extracted: 5538 images, 1 CVAT file (wm_annotations.xml), 0 missing images.
      Observed labels: stair 1492, step 3564 (doorstep 2128, curb 1185, other 251),
      ramp 143, grab_bar 922. Total annotations 6121.
      Taxonomy v0.2 maps stair → stairs and step type=curb → curb for the object
      detector. Direction review is not required for detector training; v0.1
      STAIRS_*/CURB_* decisions are preserved as direction metadata.
      doorstep, other steps, ramp, and grab_bar stay UNMAPPED_SOURCE_CLASS.
    download_url: https://zenodo.org/records/6382090/files/wm_barriers_data.zip
    raw_dir: data/raw/accessibility_barriers
    disk_space_hint: "7.97 GB zip; ~8.0 GB extracted images+xml; staging copies extra"

